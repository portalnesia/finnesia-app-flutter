# Build rilis Windows: paket MSIX (Microsoft Store) dari tag, ke draft GitHub Release.
#
# Alur distribusi lengkap: plan/windows-distribution/README.md.
#
#   - Paket → draft GitHub Release (asset). Unggah ke Partner Center dilakukan MANUAL.
#   - Tidak ada signing: Store menandatangani ulang MSIX saat sertifikasi.
#   - Upload pertama ke Partner Center WAJIB manual lewat web UI sekali dulu.
#
# Keputusan pemilik 2026-09-28: CI TIDAK mengunggah ke Store. Jalur otomatis menuntut tenant
# Entra + app registration + role Manager + empat secret, untuk pekerjaan yang terjadi sekali
# per rilis dan hanya tiga klik. Yang pemilik kerjakan: unduh .msix dari halaman run, lalu
# Partner Center → app → Update → Packages → Submit for certification.
#
# Workflow ini membutuhkan SHOREBIRD_TOKEN untuk mendaftarkan baseline Windows; tidak ada
# secret Microsoft Store karena unggah ke Partner Center tetap dilakukan manual.
#
# Trigger HANYA tag `pos-vMAJOR.MINOR.PATCH` polos — sama dengan `release-pos.yml`, dan itu
# disengaja: satu nomor versi untuk satu produk di dua platform. Yang membedakan job,
# bukan pola tag, jadi kegagalan build Windows tidak memblokir rilis Android.
#
# Prefix `pos-` menandakan aplikasi (repo ini monorepo, akan ada aplikasi lain), bukan bagian
# dari versinya — versi dibaca sebagai `${GITHUB_REF_NAME#pos-v}`, jadi `pos-v1.2.0` → `1.2.0`.
# Huruf `v` tetap di nama tag tapi TIDAK ikut ke nilai versi: `pub_semver` menolak `v1.2.0`,
# sehingga Shorebird release gagal.
#
# `env:` dan konfigurasi repo yang dipakai:
#
#   FLUTTER_VERSION      versi Flutter, sama dengan workflow lain
#   STORE_IDENTITY_NAME  Package/Identity/Name di Partner Center
#   FINNESIA_POS_WNS_APP_ID  Actions repository variable, Application (client) ID resmi
#   FINNESIA_POS_WNS_OBJECT_ID Actions repository variable, service-principal Object ID resmi
#
# Jika kedua WNS variable belum ada, workflow mempertahankan build lama dengan WNS nonaktif.
# Keduanya bukan secret; jangan menyimpan client secret Entra di aplikasi atau repo ini.
#
# Setup identitas Store: plan/windows-distribution/README.md §2.

name: Release POS Windows

on:
  push:
    tags:
      - "pos-v[0-9]+.[0-9]+.[0-9]+*"
      - "!pos-v[0-9]+.[0-9]+.[0-9]+-*"
  # Pintu kedua: `release-dispatch.yml` memanggil workflow ini, bukan mengulang logikanya.
  # Hanya token Shorebird yang diteruskan; kredensial Store tidak diperlukan.
  workflow_call:
    inputs:
      version:
        description: "X.Y.Z (production). Kosong = artifact saja; tag dibaca dari GITHUB_REF_NAME"
        required: false
        default: ""
        type: string
      # Default `yes`, bukan `no`: jalan push-tag tidak punya input sama sekali, dan default yang
      # aman di pintu yang tidak menyuruh apa-apa adalah "rilis sungguhan", yaitu perilaku sebelum
      # dispatcher ada.
      draft_release:
        description: "yes = tag + draft release, no = artifact Actions saja (uji coba)"
        required: false
        default: "yes"
        type: string
    secrets:
      SHOREBIRD_TOKEN:
        required: true

# Satu build per tag. Tag tidak bisa dipush ulang, jadi run yang berjalan tidak dibatalkan.
#
# Group-nya SENGAJA sama dengan `release-pos.yml`: kedua workflow memicu di tag polos yang
# sama dan menulis GitHub Release yang sama. Dengan group yang sama, GitHub hanya menjalankan
# satu di antaranya pada satu waktu, sehingga langkah "update release" di kedua sisi tidak
# berpacu. `cancel-in-progress: false` supaya rilis yang sedang berjalan tidak dibatalkan.
concurrency:
  group: release-pos-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.4"
  FINNESIA_POS_WINDOWS_APP_SDK_VERSION: "1.7.250909003"
  FINNESIA_POS_CPPWINRT_VERSION: "2.0.250303.1"
  # Partner Center: Package/Identity/Name. Sama dengan `msix_config: identity_name` di
  # apps/pos/pubspec.yaml. Bukan rahasia — sudah publik di listing Store.
  STORE_IDENTITY_NAME: "PutuAditya.FinnesiaPOS"

jobs:
  windows:
    runs-on: windows-latest
    # Untuk menulis asset ke draft GitHub Release di step terakhir.
    permissions:
      contents: write
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      FINNESIA_POS_WNS_APP_ID: ${{ vars.FINNESIA_POS_WNS_APP_ID }}
      FINNESIA_POS_WNS_OBJECT_ID: ${{ vars.FINNESIA_POS_WNS_OBJECT_ID }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate WNS repository variables
        run: |
          if [[ -z "$FINNESIA_POS_WNS_APP_ID" && -z "$FINNESIA_POS_WNS_OBJECT_ID" ]]; then
            echo "WNS IDs are not configured; keeping the existing WNS-disabled Windows build."
            exit 0
          fi

          if [[ -z "$FINNESIA_POS_WNS_APP_ID" || -z "$FINNESIA_POS_WNS_OBJECT_ID" ]]; then
            echo "::error::Set both FINNESIA_POS_WNS_APP_ID and FINNESIA_POS_WNS_OBJECT_ID repository variables, or leave both unset."
            exit 1
          fi

          GUID_RE='^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$'
          if [[ ! "$FINNESIA_POS_WNS_APP_ID" =~ $GUID_RE || ! "$FINNESIA_POS_WNS_OBJECT_ID" =~ $GUID_RE ]]; then
            echo "::error::WNS repository variables must contain the official Entra GUID values."
            exit 1
          fi

          echo "WNS identifiers are configured; the Windows App SDK bridge will be enabled."

      # Rumus build number identik dengan release-pos.yml, supaya satu versi punya satu
      # nomor di kedua platform.
      #
      # Dua pintu masuk hidup berdampingan: dipicu tag, atau dipicu dispatcher lewat
      # `workflow_call`. `GITHUB_REF_NAME` hanya dibaca di pintu tag — saat dispatch ia berisi nama
      # BRANCH (`main`), dan `main` bukan versi. Uji-coba (`draft release = no`) mengabaikan
      # `version`, jadi yang dipakai versi fallback: `0.0.0` dan bukan `0.0.0+local`, karena build
      # metadata ikut terbawa kepecahan versi di bawah (`PATCH` jadi `0+local`) dan membuat
      # aritmetikanya gagal.
      - name: Derive version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
        run: |
          if [ "$DRAFT_RELEASE" = "no" ]; then
            VERSION=""
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#pos-v}"
          fi

          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
            echo "Uji coba: version input diabaikan, memakai $VERSION."
          fi

          # Tag rilis hanya dibangun dari versi yang sudah dipastikan: di pintu dispatch
          # `GITHUB_REF_NAME` berisi nama branch, dan action itu akan membuat release di sana.
          if [ "$DRAFT_RELEASE" = "no" ]; then
            TAG=""
          else
            TAG="pos-v$VERSION"
          fi

          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          BUILD_NUMBER=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          # MSIX butuh empat bagian, yang keempat dipesan Store. Major 0 ditolak — dijaga
          # test/branding/store_identity_test.dart.
          echo "msix_version=${VERSION}.0" >> "$GITHUB_OUTPUT"
          echo "Versi $VERSION (MSIX ${VERSION}.0, build $BUILD_NUMBER)${TAG:+ (tag $TAG)}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Tidak ada Android SDK/NDK di sini: build Windows tidak menyentuhnya.
      - name: Resolve workspace
        run: dart pub get

      # `tools/dev`, `tools/rule_lint` dan `tools/string_lint` sengaja bukan member workspace
      # (lihat pubspec masing-masing), jadi `dart pub get` di root tidak menulis
      # `.dart_tool/package_config.json` mereka, dan `.dart_tool/` juga gitignored. Tanpa langkah
      # ini, `dart analyze` di bawah masuk ke `tools/`, tidak menemukan config, jatuh ke config
      # root, lalu `package:dev` tidak dikenal: ratusan issue `Target of URI doesn't exist` dan
      # exit code 3.
      - name: Resolve tools
        run: |
          for tool in tools/dev tools/rule_lint tools/string_lint; do
            echo "── dart pub get: $tool"
            (cd "$tool" && dart pub get)
          done

      # Sama seperti release-pos.yml; paket tidak dibangun kalau ini gagal.
      - name: Analyze
        run: dart analyze

      - name: Test pure Dart packages
        run: |
          for pkg in packages/pn_types packages/pn_pos; do
            if [ -d "$pkg/test" ]; then
              echo "── dart test: $pkg"
              (cd "$pkg" && dart test)
            fi
          done

      - name: Test Flutter packages
        run: |
          for pkg in packages/pn_ui apps/pos; do
            if [ -d "$pkg/test" ]; then
              echo "── flutter test: $pkg"
              (cd "$pkg" && flutter test)
            fi
          done

      # Microsoft.WindowsAppSDK ships WinMD metadata, not C++/WinRT projection headers.
      # Generate the two required projections with the pinned official CppWinRT tool.
      # The step runs only after the owner supplies both public IDs as repository variables.
      - name: Prepare Windows App SDK WNS headers
        if: vars.FINNESIA_POS_WNS_APP_ID != '' && vars.FINNESIA_POS_WNS_OBJECT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'finnesia-wns-nuget'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          function Expand-NuGetPackage([string]$Id, [string]$Version) {
            $lowerId = $Id.ToLowerInvariant()
            $packagePath = Join-Path $packageRoot "$Id.$Version"
            $archivePath = Join-Path $packageRoot "$Id.$Version.zip"
            $uri = "https://api.nuget.org/v3-flatcontainer/$lowerId/$Version/$lowerId.$Version.nupkg"
            Invoke-WebRequest -Uri $uri -OutFile $archivePath
            Expand-Archive -LiteralPath $archivePath -DestinationPath $packagePath -Force
            Remove-Item -LiteralPath $archivePath -Force
            return $packagePath
          }

          $appSdkPath = Expand-NuGetPackage 'Microsoft.WindowsAppSDK' $env:FINNESIA_POS_WINDOWS_APP_SDK_VERSION
          $cppWinRtPath = Expand-NuGetPackage 'Microsoft.Windows.CppWinRT' $env:FINNESIA_POS_CPPWINRT_VERSION
          $winmdPath = Join-Path $appSdkPath 'lib\uap10.0'
          $pushWinmd = Join-Path $winmdPath 'Microsoft.Windows.PushNotifications.winmd'
          $lifecycleWinmd = Join-Path $winmdPath 'Microsoft.Windows.AppLifecycle.winmd'
          $cppwinrt = Join-Path $cppWinRtPath 'bin\cppwinrt.exe'

          foreach ($required in @($pushWinmd, $lifecycleWinmd, $cppwinrt)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required Windows App SDK input is missing: $required"
            }
          }

          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $unionMetadataRoot = Join-Path $kitsRoot 'UnionMetadata'
          $referencesRoot = Join-Path $kitsRoot 'References'
          $sdkMetadataVersion = Get-ChildItem -LiteralPath $unionMetadataRoot -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $referencesRoot $_.Name) } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdkMetadataVersion) {
            throw 'Could not find a Windows SDK UnionMetadata version with matching References.'
          }

          # CppWinRT's own MSBuild target uses all WinMDs under UnionMetadata as references.
          $platformWinmds = @(Get-ChildItem -LiteralPath $sdkMetadataVersion.FullName -Filter '*.winmd' -File -Recurse)
          $appSdkReferences = @(
            Get-ChildItem -LiteralPath $winmdPath -Filter '*.winmd' -File |
              Where-Object { $_.Name -notin @('Microsoft.Windows.PushNotifications.winmd', 'Microsoft.Windows.AppLifecycle.winmd') }
          )
          if ($platformWinmds.Count -eq 0) {
            throw "No Windows SDK WinMD references found under $($sdkMetadataVersion.FullName)."
          }

          $includePath = Join-Path $env:RUNNER_TEMP 'finnesia-windows-app-sdk-include'
          New-Item -ItemType Directory -Path $includePath -Force | Out-Null
          $responseFile = Join-Path $env:RUNNER_TEMP 'finnesia-cppwinrt.rsp'
          $cppwinrtArgs = @(
            "-in `"$pushWinmd`""
            "-in `"$lifecycleWinmd`""
            "-out `"$includePath`""
          )
          foreach ($reference in @($appSdkReferences) + @($platformWinmds)) {
            $cppwinrtArgs += "-ref `"$($reference.FullName)`""
          }
          [System.IO.File]::WriteAllLines($responseFile, [string[]]$cppwinrtArgs, [System.Text.Encoding]::ASCII)
          & $cppwinrt "@$responseFile"
          if ($LASTEXITCODE -ne 0) {
            throw "cppwinrt.exe failed with exit code $LASTEXITCODE."
          }

          foreach ($header in @(
            (Join-Path $includePath 'winrt\Microsoft.Windows.PushNotifications.h'),
            (Join-Path $includePath 'winrt\Microsoft.Windows.AppLifecycle.h')
          )) {
            if (-not (Test-Path -LiteralPath $header -PathType Leaf)) {
              throw "CppWinRT did not generate the expected header: $header"
            }
          }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "FINNESIA_POS_WINDOWS_APP_SDK_INCLUDE_DIR=$includePath"
          Remove-Item -LiteralPath 'apps\pos\build\windows' -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Generated Windows App SDK $env:FINNESIA_POS_WINDOWS_APP_SDK_VERSION C++/WinRT headers and cleared the Windows CMake cache."

      # Rilis nyata dibangun oleh Shorebird agar menjadi baseline untuk patch OTA Windows.
      # Trial membangun Flutter biasa dan tidak mendaftarkan versi ke Shorebird.
      - name: Setup Shorebird
        if: inputs.draft_release != 'no'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Build Windows release with Shorebird
        if: inputs.draft_release != 'no'
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: windows
          flutter-version: ${{ env.FLUTTER_VERSION }}
          working-directory: apps/pos
          args: >-
            --build-name=${{ steps.version.outputs.version }}
            --build-number=${{ steps.version.outputs.build_number }}
            --no-confirm

      - name: Build Windows trial without registering Shorebird
        if: inputs.draft_release == 'no'
        working-directory: apps/pos
        run: |
          flutter build windows --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}"

      # pubspec mengatur `build_windows: false`, supaya msix:create mengemas output yang sudah ada
      # (hasil Shorebird pada rilis nyata) alih-alih menimpanya dengan build Flutter biasa.
      # `--version` menetapkan versi paket; `--store` mempertahankan identitas Partner Center.
      - name: Build MSIX for the Store
        working-directory: apps/pos
        run: |
          if [[ -n "$FINNESIA_POS_WNS_APP_ID" ]]; then
            dart run msix:create \
              --store \
              --version "${{ steps.version.outputs.msix_version }}" \
              --toast-activator-clsid "$FINNESIA_POS_WNS_APP_ID" \
              --toast-activator-arguments '----WindowsAppRuntimePushServer:'
          else
            dart run msix:create \
              --store \
              --version "${{ steps.version.outputs.msix_version }}"
          fi

      - name: Locate MSIX
        id: msix
        run: |
          FOUND=$(find apps/pos/build/windows -name '*.msix' -type f | head -n1)
          if [ -z "$FOUND" ]; then
            echo "::error::paket .msix tidak ditemukan setelah msix:create"
            exit 1
          fi

          # `msix:create` menamai paketnya dari `name:` di pubspec (`pos.msix`). Dinamai ulang
          # dengan versinya supaya dua paket di folder unduhan bisa dibedakan.
          NAME="finnesia-pos-windows-${{ steps.version.outputs.version }}.msix"
          mv "$FOUND" "$(dirname "$FOUND")/$NAME"

          echo "path=$(dirname "$FOUND")/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$(dirname "$FOUND")/$NAME"

      # Diperiksa atas paketnya, bukan input build: kalau identity salah, unggahan ditolak
      # dengan pesan yang tidak menyebut field mana. Pemeriksaan negatif ada supaya grep-nya
      # terbukti membaca berkas yang benar.
      - name: The package must carry the Store identity
        env:
          MSIX: ${{ steps.msix.outputs.path }}
        run: |
          unzip -p "$MSIX" AppxManifest.xml > /tmp/AppxManifest.xml

          if [ ! -s /tmp/AppxManifest.xml ]; then
            echo "::error::AppxManifest.xml tidak terbaca dari paket; pemeriksaan tidak akan membuktikan apa pun"
            exit 1
          fi

          # Identitas Store harus ada.
          grep -q "Name=\"$STORE_IDENTITY_NAME\"" /tmp/AppxManifest.xml \
            || { echo "::error::identity_name paket bukan $STORE_IDENTITY_NAME"; exit 1; }
          echo "✅ manifest: Package/Identity/Name = $STORE_IDENTITY_NAME"

          grep -q 'Publisher="CN=FD977251-3866-4FF0-ABD2-D71AAABF5137"' /tmp/AppxManifest.xml \
            || { echo "::error::publisher paket bukan subjek sertifikat Partner Center"; exit 1; }
          echo "✅ manifest: Publisher = subjek Partner Center"

          grep -q '<PublisherDisplayName>Putu Aditya</PublisherDisplayName>' /tmp/AppxManifest.xml \
            || { echo "::error::PublisherDisplayName paket salah"; exit 1; }
          echo "✅ manifest: PublisherDisplayName"

          # Nilai lama yang hanya untuk sideload harus hilang.
          ! grep -q 'com\.finnesia\.pos"' /tmp/AppxManifest.xml \
            || { echo "::error::identity_name masih nilai sideload (com.finnesia.pos)"; exit 1; }
          ! grep -q 'Msix Testing' /tmp/AppxManifest.xml \
            || { echo "::error::paket ditandatangani test certificate — ini bukan paket Store"; exit 1; }
          echo "✅ manifest: tidak ada sisa nilai sideload"

          # Versi paket harus versi tag, bukan pubspec.yaml.
          grep -q "Version=\"${{ steps.version.outputs.msix_version }}\"" /tmp/AppxManifest.xml \
            || { echo "::error::versi paket bukan versi tag (${{ steps.version.outputs.msix_version }})"; exit 1; }
          echo "✅ manifest: Version = ${{ steps.version.outputs.msix_version }}"

          if [ -n "$FINNESIA_POS_WNS_APP_ID" ]; then
            grep -Fq "ToastActivatorCLSID=\"$FINNESIA_POS_WNS_APP_ID\"" /tmp/AppxManifest.xml \
              || { echo "::error::ToastActivatorCLSID paket tidak cocok dengan FINNESIA_POS_WNS_APP_ID"; exit 1; }
            grep -Fq 'Arguments="----WindowsAppRuntimePushServer:"' /tmp/AppxManifest.xml \
              || { echo "::error::COM activator arguments untuk Windows App SDK push tidak ditemukan"; exit 1; }
            echo "✅ manifest: WNS toast activator CLSID dan COM server arguments"
          fi

      # Artifact Actions selalu ada, baik trial maupun rilis: `Create draft
      # release` di bawah dilewati saat `draft_release = no`, sedangkan langkah
      # ini tanpa `if:`. Tanpa `working-directory`: `path:` root-relative dari
      # workspace root, sama seperti `release-pos.yml`.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: finnesia-pos-windows-${{ steps.version.outputs.version }}
          path: ${{ steps.msix.outputs.path }}
          retention-days: 30

      # Draft GitHub Release, BUKAN unggahan Store. Paketnya diunduh dari sini oleh pemilik
      # lalu diunggah manual ke Partner Center.
      #
      # Satu release per tag, dan tag polos juga dipakai `release-pos.yml` — jadi dua workflow
      # menulis release yang SAMA untuk tag yang sama. Dua hal yang membuat itu aman:
      #
      #   1. `concurrency` di atas memakai group yang sama dengan `release-pos.yml`, supaya
      #      keduanya berbaris, bukan berpacu.
      #   2. `name:` SENGAJA tidak diisi di sini. Action-nya memakai `input_name ||
      #      existingRelease.name || tag`, jadi membiarkannya kosong MEMPERTAHANKAN nama yang
      #      #      `release-pos.yml` pasang ("Finnesia POS vX.Y.Z"). Kalau diisi, judul release akan
      #      berubah jadi "... Windows ..." setiap kali job ini selesai belakangan, padahal
      #      release-nya juga memuat APK Android.
      #   3. `tag_name` bukan `github.ref_name`: pintu dispatcher tidak punya tag, dan
      #      `github.ref_name` di sana berisi nama branch.
      - name: Create draft release
        if: inputs.draft_release != 'no'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.msix.outputs.path }}
