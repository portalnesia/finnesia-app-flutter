# Satu layar untuk menjalankan rilis, dengan gerbang sebelum build dan gerbang manusia sebelum
# store.
#
# File ini memvalidasi kombinasi input, menjalankan preflight Android production, lalu membuat tag
# kalau diminta dan memanggil workflow platform. Preflight membangun dan memeriksa APK dengan versi
# rilis yang benar; lane Android setelah tag memakai ulang APK itu dan hanya membangun AAB Shorebird.
# Build Android dan Windows berjalan paralel; hanya penulisan ke draft release yang diserialisasi.
#
# Matriks kombinasi: plan/release-dispatch/SPEC.md §2a. Validasi tidak ditulis sebagai rantai `if:`
# YAML karena YAML tidak bisa diuji di repo ini; sumber kebenarannya fungsi murni
# `tools/dev/lib/dispatch.dart` yang diuji `dart test`, dan file ini memanggilnya.
#
# Dua pintu masuk hidup berdampingan: tag langsung dan dispatcher manual. Tag release/patch
# memicu workflow platform yang sesuai; satu kegagalan platform tidak membatalkan yang lain.
# platform tidak membatalkan yang lain. File ini MENAMBAH pintu manual, bukan mengganti tag.
#
# Secret ditulis eksplisit per pemanggilan, bukan `secrets: inherit`: eksplisit bisa di-grep dan
# diuji, dan `inherit` akan meneruskan secret yang tidak dibutuhkan ke workflow lain.

name: Release Dispatch

on:
  workflow_dispatch:
    inputs:
      aplikasi:
        description: "Aplikasi (sekarang hanya pos)"
        required: true
        default: "pos"
        type: choice
        options: [pos]
      env:
        description: "staging | production | patch"
        required: true
        type: choice
        options: [staging, production, patch]
      device:
        description: "android | windows | all"
        required: true
        type: choice
        options: [android, windows, all]
      draft_release:
        description: "no = uji coba (artifact saja, tanpa tag/release/store). yes = build + tag + draft release"
        required: true
        type: choice
        options: ["no", "yes"]
      version:
        description: "Wajib bila draft release = yes (jadi nama tag). Diabaikan bila no. staging: X.Y.Z-staging.N, production: X.Y.Z, patch: X.Y.Z-N"
        required: false
        default: ""
        type: string

# Antrean manual terpisah per kombinasi, supaya dua kombinasi berbeda tidak saling menunggu.
# Antrean di dalam callee tetap per `github.ref`, dan saat dispatch `github.ref` adalah ref branch:
# itu disengaja (dua run manual di branch yang sama menulis draft yang sama, jadi mereka harus berbaris).
concurrency:
  group: release-dispatch-${{ inputs.aplikasi }}-${{ inputs.env }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  # Satu-satunya gerbang. Kombinasi yang ditolak keluar di sini: exit 64 plus `::error::` di stderr
  # (annotation GitHub), sebelum ada artifact, sebelum ada tag, sebelum ada runner yang build.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Refuse a combination that is not on the matrix
        run: dart run tools/dev/bin/dev.dart dispatch --env "${{ inputs.env }}" --device "${{ inputs.device }}" --draft "${{ inputs.draft_release }}" --version "${{ inputs.version }}"

  # Semua production Android (termasuk uji coba `draft_release = no`) harus lolos preflight ini
  # sebelum job tag bisa berjalan. Untuk rilis nyata, artifact APK bertanda versi yang benar dipakai
  # ulang oleh lane pasca-tag; preflight tidak mendaftarkan Shorebird atau membuat GitHub Release.
  production-android-preflight:
    needs: validate
    if: inputs.env == 'production' && (inputs.device == 'android' || inputs.device == 'all')
    uses: ./.github/workflows/release-pos.yml
    with:
      version: ${{ inputs.version }}
      draft_release: ${{ inputs.draft_release }}
      preflight: true
    secrets:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # Tag dibuat DI SINI, eksplisit dari commit run ini, setelah preflight Android (jika lane itu dipilih).
  # Alasannya: `softprops/action-gh-release` membuat tag yang belum ada dari DEFAULT BRANCH, yang
  # belum tentu commit yang di-dispatch — draft lalu menempel pada commit yang salah. `context.sha`
  # adalah HEAD ref yang dipilih di UI dispatch, jadi release tidak bisa bergeser.
  #
  # Job ini tetap sukses pada kombinasi valid dengan preflight tidak gagal. Lane non-Android boleh
  # melewati preflight; untuk production Android, status failure/cancelled mencegah pembuatan tag.
  tag:
    needs: [validate, production-android-preflight]
    if: always() && needs.validate.result == 'success' && (needs.production-android-preflight.result == 'success' || needs.production-android-preflight.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release tag from the dispatched commit
        if: inputs.draft_release == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'pos-v${{ inputs.version }}';
            const ref = `refs/tags/${tag}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              // Format endpoint GET /git/ref/{ref}: `tags/<tag>`, tanpa prefix `refs/`.
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Tag ${tag} sudah ada; dipakai apa adanya.`);
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({ owner, repo, ref, sha: context.sha });
              core.info(`Tag ${tag} dibuat pada ${context.sha}.`);
            }

  # ── Pemanggilan ──────────────────────────────────────────────────────────
  # Semua lane bergantung pada validate dan tag. Karena job tag juga bergantung pada preflight Android
  # yang sengaja dilewati oleh lane non-Android, kondisi lane memakai `always()` agar skip transitif
  # tidak membatalkan build; hasil validate/tag tetap harus sukses.
  #
  # Lima job lane platform ditambah preflight Android production. `all` memilih dua job platform;
  # kombinasi yang tidak ada di matriks ditolak `validate` sebelum job mana pun dievaluasi.

  staging-android:
    needs: [validate, tag]
    if: always() && needs.validate.result == 'success' && needs.tag.result == 'success' && inputs.env == 'staging' && inputs.device == 'android'
    uses: ./.github/workflows/staging-pos.yml
    with:
      version: ${{ inputs.version }}
      draft_release: ${{ inputs.draft_release }}
    secrets:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # `all` ikut lewat sini. Build Android dimulai setelah preflight/tag dan berjalan paralel dengan
  # Windows; langkah publish di kedua reusable workflow berbagi concurrency group agar update draft
  # yang sama tidak berpacu.
  production-android:
    needs: [validate, tag, production-android-preflight]
    if: always() && needs.validate.result == 'success' && needs.tag.result == 'success' && needs.production-android-preflight.result == 'success' && inputs.env == 'production' && (inputs.device == 'android' || inputs.device == 'all') && inputs.draft_release == 'yes'
    uses: ./.github/workflows/release-pos.yml
    with:
      version: ${{ inputs.version }}
      draft_release: ${{ inputs.draft_release }}
      reuse_preflight_apk: true
    secrets:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  production-windows:
    needs: [validate, tag]
    if: always() && needs.validate.result == 'success' && needs.tag.result == 'success' && inputs.env == 'production' && (inputs.device == 'windows' || inputs.device == 'all')
    uses: ./.github/workflows/windows-pos.yml
    with:
      version: ${{ inputs.version }}
      draft_release: ${{ inputs.draft_release }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}

  # Patch tidak membuat draft: tidak ada berkas untuk dilampirkan. Ketertelusurannya adalah tag
  # `pos-vX.Y.Z-N` itu sendiri, dan tag itu dibuat job di atas.
  patch-android:
    needs: [validate, tag]
    if: always() && needs.validate.result == 'success' && needs.tag.result == 'success' && inputs.env == 'patch' && (inputs.device == 'android' || inputs.device == 'all')
    uses: ./.github/workflows/shorebird-patch.yml
    with:
      version: ${{ inputs.version }}
      draft_release: ${{ inputs.draft_release }}
    secrets:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  patch-windows:
    needs: [validate, tag]
    if: always() && needs.validate.result == 'success' && needs.tag.result == 'success' && inputs.env == 'patch' && (inputs.device == 'windows' || inputs.device == 'all')
    uses: ./.github/workflows/shorebird-patch-windows.yml
    with:
      version: ${{ inputs.version }}
      draft_release: ${{ inputs.draft_release }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
