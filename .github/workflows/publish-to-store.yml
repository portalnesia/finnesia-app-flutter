# Satu-satunya jalan ke Play Console.
#
# Berjalan SETELAH manusia menekan Publish di halaman Releases — bukan saat build. Run build
# (release-pos.yml) hanya membangun dan melampirkan APK + AAB ke draft; file mana yang benar-benar
# masuk store adalah keputusan manusia, jadi gerbang humansnya di sini, bukan di sana.
#
# Trigger: `release: types: [published]`. Sebuah draft tidak memicu apa pun: promoted-nya tetap
# manual di Console (docs/distribution.md §Promote).
#
# Filter tag ada di level JOB, bukan di `on:` — event `release` tidak mendukung filter tag di
# `on:`. Yang ditulis di `if:` cuma aturan prefix `pos-v` (repo ini monorepo, aplikasi lain punya
# prefixnya). Aturan kedua, yaitu tag polos `pos-vX.Y.Z`, TIDAK bisa ditulis di situ: bahasa
# ekspresi GitHub tidak punya penghapusan substring, split, atau regex, jadi satu-satunya cara
# terbaca untuk memeriksa sisa tag adalah `contains(tag_name, '-')` — dan itu tidak pernah benar,
# karena prefix `pos-v` sendiri mengandung hyphen, sehingga akan menolak SEGALA tag POS termasuk
# tag polos yang justru harus naik. Karena itu bentuk tag diperiksa di step shell pertama, di mana
# operator `=~` memang ada. Tag staging (`pos-vX.Y.Z-staging.N`) dan tag patch (`pos-vX.Y.Z-N`)
# tetap melewati `if:` ini, lalu berhenti di gate itu.
#
# AAB diambil dari asset release dengan `gh release download`, bukan dari artifact Actions: artifact
# hidup 30 hari dan butuh `run-id` + token lintas run, sedangkan asset release adalah berkas yang
# baru saja dilihat manusia sebelum menekan Publish.
#
# Token Shorebird tidak dibutuhkan di sini: Shorebird sudah selesai di run build, dan tidak ada
# OTA yang boleh ikut terkirim tanpa dilihat.

name: Publish to Store

on:
  release:
    types: [published]

jobs:
  play:
    # Hanya tag dengan prefix `pos-v`. Bentuk polos tag diputuskan di langkah `tag` di bawah.
    if: startsWith(github.event.release.tag_name, 'pos-v')
    runs-on: ubuntu-latest
    # `gh release download` hanya membaca, jadi `read` sudah cukup. Tidak menulis apa pun ke repo.
    permissions:
      contents: read
    # Satu release di-Publish satu kali, jadi antrean per tag sudah cukup. Group ini sengaja
    # terpisah dari `release-pos-${github.ref}` milik dua penulis draft: file ini tidak menulis
    # draft, jadi tidak boleh ikut berebut antrean yang belumoriau itu.
    concurrency:
      group: publish-to-store-${{ github.event.release.tag_name }}
      cancel-in-progress: false

    steps:
      # Satu-satunya tempat bentuk tag bisa dipastikan. `plain=false` sengaja hanya memberi
      # `::notice::` dan tidak `exit 1`: staging dan patch juga menghasilkan rilis, jadi run merah
      # untuk keadaan normal itu noise yang melatih pemilik mengabaikan merah.
      - name: Accept only a plain pos-vX.Y.Z tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^pos-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "plain=true" >> "$GITHUB_OUTPUT"
          else
            echo "plain=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag '$TAG' bukan tag rilis polos; upload Play dilewati."
          fi

      - name: Download AAB from the published release
        if: steps.tag.outputs.plain == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/store
          gh release download "${{ github.event.release.tag_name }}" --pattern '*.aab' --dir /tmp/store
          ls -lh /tmp/store

      - name: Publish to Play Console (internal track)
        if: steps.tag.outputs.plain == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.finnesia.pos
          releaseFiles: /tmp/store/*.aab
          track: internal
          status: completed