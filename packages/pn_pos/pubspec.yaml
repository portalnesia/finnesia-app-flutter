name: pn_pos
publish_to: none
environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  # No version, no path: resolved by the workspace. See
  # `.claude/rules/architecture.md` §2.
  #
  # `flutter` is deliberately absent and must stay absent. It is what keeps
  # POS money logic testable with `dart test` (milliseconds) instead of
  # `flutter test` (seconds). `.claude/rules/architecture.md` §3.
  #
  # `freezed` is a dev dependency below and generates the data classes; only the
  # annotation package is a runtime dependency. It runs on pure Dart, so it does
  # not drag Flutter in.
  freezed_annotation: ^3.1.0

  # `fromJson`/`toJson` for the pending-sale entry, which the store keeps as JSON text
  # (`plan/offline-queue/README.md` §4.2). Hand-writing them is what
  # `.claude/rules/patterns.md` §2a forbids. Same pair `pn_types` uses, and pure Dart.
  json_annotation: ^4.12.0
  pn_types:

  # Both are for `src/datetime.dart`, and both exist only because Dart lacks what
  # JavaScript has built in. `Intl.DateTimeFormat` with a named `timeZone` and a
  # bundled zone database are part of the JS runtime; Dart needs these two packages
  # plus an explicit `initializePosDateTime()` call before first use.
  #
  # Pure Dart, no Flutter, no platform channels — `dart test` still runs in
  # milliseconds. The zone data ships with the package rather than being read from
  # the device, so a tenant's `Asia/Jakarta` resolves the same on every tablet.
  intl: ^0.20.3
  timezone: ^0.11.1

  # ULID for the offline-checkout `client_ref`. Crockford encoding, monotonic factory and
  # timestamp decode are all here; rewriting them is what `.claude/rules/patterns.md` §2a
  # forbids. Pure Dart (`dart:math` only), so `pn_pos` stays Flutter-free.
  ulid: ^2.2.0

dev_dependencies:
  build_runner: ^2.4.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  test: any
