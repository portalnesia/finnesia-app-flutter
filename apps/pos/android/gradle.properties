org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation crashes on this toolchain combination
# (Gradle 9.3.1 + Kotlin 2.4.0) once plugins with Kotlin sources are added:
#   "Could not close incremental caches ... Storage ... already registered"
# Reproducible after `flutter clean`. This is a workaround, not a root fix:
# it makes every build slower. Revisit on the next Flutter upgrade, where
# Kotlin/Gradle may have fixed it.
# See plan/scaffold/00-environment.md §4.
kotlin.incremental=false
